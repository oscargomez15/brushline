[[redirects]]
  from = "/estimator/*"
  to = "/estimator/:splat"
  status = 200
  force = true
  conditions = { Role = ["estimator", "admin"] }
  
[[redirects]]
  from = "/estimator/*"
  to = "/login"
  status = 401
  force = true

# SPA fallback (must be last)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200